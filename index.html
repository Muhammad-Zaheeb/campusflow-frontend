<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusFlow: a task manager for students. Track assignments, priorities, due dates and overdue work." />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b26" media="(prefers-color-scheme: dark)" />
    <title>CampusFlow | Student Task Manager</title>
    <script>
      // Apply the saved theme before the page paints, so there is no flash.
      ;(function () {
        try {
          var saved = localStorage.getItem("theme")
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
